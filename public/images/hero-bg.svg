<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151D" />
      <stop offset="40%" stop-color="#0B1F2A" />
      <stop offset="100%" stop-color="#123040" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6F78" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B7E34A" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#23465C" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="url(#grad-navy)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- Topographic / Geological Contours -->
  <g fill="none" stroke="#1F6F78" stroke-width="1.5" stroke-opacity="0.25">
    <path d="M-100,700 C300,550 700,850 1100,600 C1500,450 1700,650 2100,500" />
    <path d="M-100,750 C320,600 720,900 1120,650 C1520,500 1720,700 2100,550" />
    <path d="M-100,800 C340,650 740,950 1140,700 C1540,550 1740,750 2100,600" />
    <path d="M-100,850 C360,700 760,1000 1160,750 C1560,600 1760,800 2100,650" />
  </g>

  <!-- Atmospheric Glows -->
  <circle cx="1600" cy="300" r="500" fill="#1F6F78" fill-opacity="0.15" filter="blur(80px)" />
  <circle cx="200" cy="800" r="400" fill="#B7E34A" fill-opacity="0.06" filter="blur(90px)" />

  <!-- Subtle Horizon Energy Waves -->
  <path d="M0,900 Q 480,820 960,880 T 1920,840 L 1920,1080 L 0,1080 Z" fill="url(#grad-accent)" />
</svg>
