<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nz-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2638" />
      <stop offset="60%" stop-color="#143D52" />
      <stop offset="100%" stop-color="#1E5C6B" />
    </linearGradient>
    <linearGradient id="nz-terrain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#153628" />
      <stop offset="100%" stop-color="#0C2018" />
    </linearGradient>
    <linearGradient id="nz-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B7E34A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1F6F78" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky & Ocean Background -->
  <rect width="1200" height="800" fill="url(#nz-sky)" />

  <!-- Mount Taranaki Profile Silhouette -->
  <path d="M 0,650 L 320,620 L 520,440 L 570,390 L 600,320 L 630,390 L 680,440 L 880,620 L 1200,650 L 1200,800 L 0,800 Z" fill="#0E232E" />
  <!-- Snowcap Peak -->
  <polygon points="600,320 580,360 595,355 605,365 620,360" fill="#E2E8F0" opacity="0.85" />

  <!-- Rolling Taranaki Foothills & Coastal Plain -->
  <path d="M 0,680 Q 250,600 550,660 T 1200,670 L 1200,800 L 0,800 Z" fill="url(#nz-terrain)" />

  <!-- Industrial Offshore & Onshore Production Facility Visuals -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.9">
    <!-- Production Wellhead / Pumpjack silhouette -->
    <path d="M 850,660 L 850,560 L 910,660 Z" fill="#1E3A4A" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="880" y1="560" x2="880" y2="660" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="840" y1="560" x2="920" y2="560" stroke="#38BDF8" stroke-width="2" />
    <!-- Beam -->
    <line x1="820" y1="540" x2="940" y2="580" stroke="#E2E8F0" stroke-width="4" />
    <!-- Pipeline Network -->
    <path d="M 0,760 C 300,740 600,770 1200,750" stroke="#1F6F78" stroke-width="4" />
    <path d="M 750,755 L 750,680 L 800,680" stroke="#1F6F78" stroke-width="3" />
  </g>

  <!-- Gas/Energy Subtle Pulse Accent -->
  <circle cx="880" cy="560" r="16" fill="#B7E34A" fill-opacity="0.2" />
  <circle cx="880" cy="560" r="6" fill="#B7E34A" />

</svg>
