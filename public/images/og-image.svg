<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151D" />
      <stop offset="60%" stop-color="#0B1F2A" />
      <stop offset="100%" stop-color="#123040" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />

  <g transform="translate(100, 120)">
    <!-- Ticker Tag -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#162F3F" stroke="#27485F" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#B7E34A" />
    <text x="35" y="23" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">TSX-V: MNRG</text>

    <!-- Main Heading -->
    <text x="0" y="110" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="bold" letter-spacing="-1">
      MONUMENTAL ENERGY
    </text>

    <text x="0" y="170" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="500">
      Better energy for the future and today.
    </text>

    <text x="0" y="230" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="20">
      Near-term oil &amp; gas production in NZ • Strategic lithium royalty in Chile
    </text>

    <!-- 4 Stats Banner -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="1000" height="110" rx="16" fill="#0E2836" stroke="#1D3B4C" stroke-width="1.5" />
      
      <text x="50" y="55" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">8,500 ha</text>
      <text x="50" y="85" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Lithium Triangle Chile</text>

      <text x="320" y="55" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">2% NSR</text>
      <text x="320" y="85" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Gross Royalty Holding</text>

      <text x="590" y="55" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">TSX-V</text>
      <text x="590" y="85" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Tier-1 Canadian Exchange</text>

      <text x="820" y="55" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="bold">[PRODUCTION]</text>
      <text x="820" y="85" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Near-Term NZ Target</text>
    </g>
