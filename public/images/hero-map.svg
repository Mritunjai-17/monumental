<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2836" />
      <stop offset="100%" stop-color="#081A24" />
    </linearGradient>
    <linearGradient id="line-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6F78" />
      <stop offset="100%" stop-color="#B7E34A" />
    </linearGradient>
  </defs>

  <!-- Background Base Card -->
  <rect width="600" height="480" rx="20" fill="url(#card-grad)" stroke="#1D3B4C" stroke-width="1.5" />

  <!-- Subtle Pacific Basin Longitude / Latitude Grid Lines -->
  <g stroke="#1D3B4C" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="60" y1="120" x2="540" y2="120" />
    <line x1="60" y1="240" x2="540" y2="240" />
    <line x1="60" y1="360" x2="540" y2="360" />
    <line x1="180" y1="60" x2="180" y2="420" />
    <line x1="380" y1="60" x2="380" y2="420" />
  </g>

  <!-- Connecting Trans-Pacific Arc -->
  <path d="M 160,280 C 220,130 380,110 460,200" fill="none" stroke="url(#line-teal)" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Asset 1 Node: New Zealand (Taranaki Basin) -->
  <g transform="translate(160, 280)">
    <circle r="36" fill="#1F6F78" fill-opacity="0.15" />
    <circle r="20" fill="#1F6F78" fill-opacity="0.3" />
    <circle r="7" fill="#B7E34A" />
    <circle r="3" fill="#0B1F2A" />
  </g>

  <!-- Asset 1 Info Callout Box (New Zealand) -->
  <g transform="translate(50, 315)">
    <rect width="210" height="96" rx="12" fill="#0B1F2A" stroke="#1F6F78" stroke-width="1.5" />
    <text x="16" y="28" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">NEW ZEALAND</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Taranaki Basin</text>
    <text x="16" y="74" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Near-term oil &amp; gas assets</text>
  </g>

  <!-- Asset 2 Node: Chile (Salar de Turi) -->
  <g transform="translate(460, 200)">
    <circle r="36" fill="#B7E34A" fill-opacity="0.12" />
    <circle r="20" fill="#1F6F78" fill-opacity="0.3" />
    <circle r="7" fill="#B7E34A" />
    <circle r="3" fill="#0B1F2A" />
  </g>

  <!-- Asset 2 Info Callout Box (Chile) -->
  <g transform="translate(340, 70)">
    <rect width="210" height="96" rx="12" fill="#0B1F2A" stroke="#B7E34A" stroke-width="1.5" />
    <text x="16" y="28" fill="#B7E34A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">CHILE</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Salar de Turi</text>
    <text x="16" y="74" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">8,500 ha • 2% NSR royalty</text>
  </g>

  <!-- Strategic Header Tag -->
  <g transform="translate(50, 45)">
    <rect width="180" height="30" rx="8" fill="#162F3F" stroke="#27485F" stroke-width="1" />
    <text x="14" y="20" fill="#DDE3E3" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">DUAL-ASSET PORTFOLIO</text>
  </g>
</svg>
