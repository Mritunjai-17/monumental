<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-labelledby="t d">
  <title id="t">Monumental Energy asset map</title>
  <desc id="d">Stylised map of the South Pacific with two pins: Taranaki Basin, New Zealand (oil and gas) and Salar de Turi, Chile (lithium royalty), joined by a connector line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2836" />
      <stop offset="1" stop-color="#081A24" />
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6F78" />
      <stop offset="1" stop-color="#B7E34A" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1F6F78" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="600" height="480" rx="20" fill="url(#bg)" />
  <rect width="600" height="480" rx="20" fill="url(#dots)" />

  <!-- Graticule -->
  <g stroke="#1D3B4C" stroke-width="1" fill="none">
    <path d="M0 160 H600 M0 320 H600 M200 0 V480 M400 0 V480" stroke-dasharray="2 6" />
  </g>

  <!-- South America (west coast, stylised) -->
  <path d="M600 40 L540 52 L512 96 L500 150 L494 200 L488 250 L482 300 L474 352 L466 404 L470 448 L494 480 L600 480 Z"
        fill="#16364A" stroke="#27485F" stroke-width="1.5" />
  <!-- Chile strip -->
  <path d="M512 96 L500 150 L494 200 L488 250 L482 300 L474 352 L466 404 L470 448 L486 470 L486 440 L492 400 L498 352 L506 300 L512 250 L518 200 L524 150 L530 100 Z"
        fill="#1F6F78" fill-opacity="0.45" stroke="#1F6F78" stroke-width="1" />

  <!-- New Zealand (stylised) -->
  <path d="M112 258 L124 250 L134 262 L146 270 L156 288 L150 300 L138 304 L128 318 L118 314 L114 300 L104 296 L100 284 L108 276 Z"
        fill="#16364A" stroke="#27485F" stroke-width="1.5" />
  <path d="M110 322 L122 326 L118 342 L106 362 L92 378 L78 386 L70 378 L80 362 L94 344 L102 330 Z"
        fill="#16364A" stroke="#27485F" stroke-width="1.5" />

  <!-- Connector line -->
  <path d="M106 288 C 220 150, 380 120, 508 214" fill="none" stroke="url(#route)" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" />

  <!-- Pin: Taranaki Basin -->
  <g transform="translate(106 288)">
    <circle r="18" fill="#1F6F78" fill-opacity="0.2" />
    <path d="M0 -2 C -8 -2 -12 -9 -12 -14 A 12 12 0 1 1 12 -14 C 12 -9 8 -2 0 -2 Z" transform="translate(0 2)" fill="#1F6F78" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cy="-12" r="4" fill="#FFFFFF" />
  </g>
  <g font-family="Space Grotesk, Segoe UI, Arial, sans-serif">
    <rect x="140" y="330" width="186" height="52" rx="10" fill="#0B1F2A" stroke="#1D3B4C" />
    <text x="154" y="352" font-size="14" font-weight="700" fill="#FFFFFF">Taranaki Basin, NZ</text>
    <text x="154" y="370" font-size="11" letter-spacing="1.2" fill="#94A3B8">OIL &amp; GAS</text>
  </g>

  <!-- Pin: Salar de Turi -->
  <g transform="translate(508 214)">
    <circle r="18" fill="#B7E34A" fill-opacity="0.2" />
    <path d="M0 -2 C -8 -2 -12 -9 -12 -14 A 12 12 0 1 1 12 -14 C 12 -9 8 -2 0 -2 Z" transform="translate(0 2)" fill="#B7E34A" stroke="#0B1F2A" stroke-width="1.5" />
    <circle cy="-12" r="4" fill="#0B1F2A" />
  </g>
  <g font-family="Space Grotesk, Segoe UI, Arial, sans-serif">
    <rect x="350" y="246" width="186" height="52" rx="10" fill="#0B1F2A" stroke="#1D3B4C" />
    <text x="364" y="268" font-size="14" font-weight="700" fill="#FFFFFF">Salar de Turi, Chile</text>
    <text x="364" y="286" font-size="11" letter-spacing="1.2" fill="#B7E34A">LITHIUM ROYALTY</text>
  </g>

  <!-- Legend -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8">
    <text x="32" y="448">Stylised, not to scale</text>
  </g>
</svg>
